<!doctype html><html><head><title>Import Log — CSS Cascade Demo</title>
<!-- andocs-opendesign-runtime:start -->
<meta name="andocs-opendesign-runtime" content="1" data-andocs-opendesign-runtime="v1">
<style data-andocs-opendesign-runtime="v1">
:root {
  --accent: oklch(0.95 0.02 255);
  --accent-foreground: oklch(0.48 0.2 255);
  --background: oklch(0.99 0 0);
  --border: oklch(0.9 0.01 250);
  --card: oklch(0.99 0 0);
  --card-foreground: oklch(0.15 0.03 250);
  --chart-1: oklch(0.55 0.18 255);
  --chart-2: oklch(0.5 0.16 255);
  --chart-3: oklch(0.45 0.14 255);
  --chart-4: oklch(0.4 0.12 255);
  --chart-5: oklch(0.35 0.1 255);
  --destructive: oklch(0.55 0.22 25);
  --destructive-foreground: oklch(1 0 0);
  --font-mono: "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --foreground: oklch(0.15 0.03 250);
  --input: oklch(0.96 0.005 250);
  --muted: oklch(0.96 0.005 250);
  --muted-foreground: oklch(0.4 0.02 250);
  --popover: oklch(0.99 0 0);
  --popover-foreground: oklch(0.15 0.03 250);
  --primary: oklch(0.48 0.2 255);
  --primary-foreground: oklch(1 0 0);
  --radius: 0.5rem;
  --ring: oklch(0.48 0.2 255);
  --secondary: oklch(0.97 0.01 250);
  --secondary-foreground: oklch(0.2 0.03 250);
  --shadow: 0 2px 4px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --shadow-color: rgb(0 0 0);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-offset-x: 0px;
  --shadow-offset-y: 2px;
  --shadow-opacity: 0.1;
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-spread: 0px;
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.06);
  --spacing: 0.25rem;
}
</style>
<link rel="stylesheet" data-andocs-shared-css data-andocs-opendesign-runtime="v1" href="../../shared.css">
<link rel="stylesheet" data-andocs-shared-css data-andocs-opendesign-runtime="v1" href="../shared.css">
<script data-andocs-shared-js data-andocs-opendesign-runtime="v1" src="../../shared.js"></script>
<script data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<!-- andocs-opendesign-runtime:end -->
</head><body>

<div class="prototype-shell">
  <div class="px-8 pt-8 pb-7">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="prototype-title">Import Log</h2>
        <p class="prototype-subtitle mt-1">CSS Cascade Demo — this page inherits base styles from the parent <code>shared.css</code> and adds table/badge styles from its own <code>shared.css</code></p>
      </div>
      <button class="prototype-btn prototype-btn-primary" x-data x-on:click="$el.textContent = 'Synced!'">
        Sync Now
      </button>
    </div>

    <div class="mt-6" x-data="{
      imports: [
        { id: 'IMP-001', source: 'SAP ERP', records: 1247, status: 'success', time: '2.3s' },
        { id: 'IMP-002', source: 'Salesforce', records: 892, status: 'success', time: '1.8s' },
        { id: 'IMP-003', source: 'Legacy DB', records: 0, status: 'error', time: '12.1s' },
        { id: 'IMP-004', source: 'CSV Upload', records: 56, status: 'warning', time: '0.4s' },
        { id: 'IMP-005', source: 'REST API', records: 3401, status: 'success', time: '5.7s' },
      ]
    }">
      <table class="cascade-table">
        <thead>
          <tr>
            <th>Import ID</th>
            <th>Source</th>
            <th>Records</th>
            <th>Status</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="imp in imports" :key="imp.id">
            <tr>
              <td class="font-mono text-xs" x-text="imp.id"></td>
              <td x-text="imp.source"></td>
              <td class="font-mono" x-text="imp.records.toLocaleString()"></td>
              <td>
                <span class="cascade-badge"
                  :class="{
                    'cascade-badge-success': imp.status === 'success',
                    'cascade-badge-warning': imp.status === 'warning',
                    'cascade-badge-error': imp.status === 'error',
                  }"
                  x-text="imp.status"></span>
              </td>
              <td class="font-mono text-xs" x-text="imp.time"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body></html>
