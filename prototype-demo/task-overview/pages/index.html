<!doctype html>
<html lang="en">
  <head>
<!-- andocs-opendesign-runtime:start -->
<meta name="andocs-opendesign-runtime" content="1" data-andocs-opendesign-runtime="v1">
<style data-andocs-opendesign-runtime="v1">
:root {
  --accent: oklch(0.95 0.02 255);
  --accent-foreground: oklch(0.48 0.2 255);
  --background: oklch(0.99 0 0);
  --border: oklch(0.9 0.01 250);
  --card: oklch(0.99 0 0);
  --card-foreground: oklch(0.15 0.03 250);
  --chart-1: oklch(0.55 0.18 255);
  --chart-2: oklch(0.5 0.16 255);
  --chart-3: oklch(0.45 0.14 255);
  --chart-4: oklch(0.4 0.12 255);
  --chart-5: oklch(0.35 0.1 255);
  --destructive: oklch(0.55 0.22 25);
  --destructive-foreground: oklch(1 0 0);
  --font-mono: "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --foreground: oklch(0.15 0.03 250);
  --input: oklch(0.96 0.005 250);
  --muted: oklch(0.96 0.005 250);
  --muted-foreground: oklch(0.4 0.02 250);
  --popover: oklch(0.99 0 0);
  --popover-foreground: oklch(0.15 0.03 250);
  --primary: oklch(0.48 0.2 255);
  --primary-foreground: oklch(1 0 0);
  --radius: 0.5rem;
  --ring: oklch(0.48 0.2 255);
  --secondary: oklch(0.97 0.01 250);
  --secondary-foreground: oklch(0.2 0.03 250);
  --shadow: 0 2px 4px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --shadow-color: rgb(0 0 0);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-offset-x: 0px;
  --shadow-offset-y: 2px;
  --shadow-opacity: 0.1;
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-spread: 0px;
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.06);
  --spacing: 0.25rem;
}
</style>
<link rel="stylesheet" data-andocs-shared-css data-andocs-opendesign-runtime="v1" href="../../shared.css">
<script data-andocs-shared-js data-andocs-opendesign-runtime="v1" src="../../shared.js"></script>
<script data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<!-- andocs-opendesign-runtime:end -->

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Overview</title>
    <style>
      .overview { max-width: 760px; margin: 0 auto; }
      .overview-header, .overview-row { display: flex; align-items: center; gap: 12px; }
      .overview-header { justify-content: space-between; padding: 24px; }
      .overview-body { padding: 0 24px 24px; }
      .overview-list { display: grid; gap: 8px; padding: 0; margin: 18px 0 0; list-style: none; }
      .overview-row { min-height: 48px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); }
      .overview-row [data-complete="true"] { color: var(--muted-foreground); text-decoration: line-through; }
      .overview-row small { margin-left: auto; color: var(--muted-foreground); white-space: nowrap; }
      .overview-status { min-height: 1.5em; color: var(--muted-foreground); font-size: 0.8125rem; }
      .overview-status[data-kind="error"] { color: #a33b20; }
    </style>
  </head>
  <body>
    <main class="prototype-shell overview" aria-busy="true">
      <header class="overview-header">
        <div>
          <h1 class="prototype-title">Task Overview</h1>
          <p class="prototype-subtitle mt-1">A read-only view of this project's shared tasks</p>
        </div>
        <span class="prototype-badge">Project collection</span>
      </header>
      <hr class="prototype-divider" style="margin: 0" />
      <section class="overview-body" aria-label="Project task overview">
        <p id="overview-status" class="overview-status" role="status" aria-live="polite">Opening tasks…</p>
        <ul id="overview-list" class="overview-list"></ul>
      </section>
    </main>
    <script>
      (() => {
        const data = window.andocsData;
        const root = document.querySelector(".overview");
        const list = document.querySelector("#overview-list");
        const status = document.querySelector("#overview-status");
        let unsubscribe = () => {};

        function render(records) {
          if (!Array.isArray(records) || !records.every((record) =>
            record && typeof record.id === "string" && record.value
            && typeof record.value.title === "string" && typeof record.value.completed === "boolean"
            && Number.isFinite(record.value.createdAt)
            && (record.value.order === undefined || (typeof record.value.order === "number" && Number.isFinite(record.value.order))))) {
            throw new Error("Invalid task data");
          }
          const tasks = [...records].sort((left, right) =>
            (left.value.order ?? left.value.createdAt) - (right.value.order ?? right.value.createdAt)
            || left.value.createdAt - right.value.createdAt || left.id.localeCompare(right.id));
          list.replaceChildren();
          if (!tasks.length) {
            const empty = document.createElement("li");
            empty.className = "prototype-subtitle";
            empty.textContent = "No tasks in this dataset yet.";
            list.append(empty);
          }
          for (const { value } of tasks) {
            const row = document.createElement("li");
            row.className = "overview-row";
            const title = document.createElement("span");
            title.dataset.complete = String(value.completed);
            title.textContent = value.title;
            const state = document.createElement("small");
            state.textContent = value.completed ? "Done" : "Open";
            row.append(title, state);
            list.append(row);
          }
          status.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"} in the selected dataset.`;
          status.dataset.kind = "";
        }

        function fail() {
          status.textContent = "Task updates are unavailable. Reload to reconnect.";
          status.dataset.kind = "error";
        }
        render.error = fail;

        async function initialize() {
          try {
            if (!data) throw new Error("Task API unavailable");
            await data.ready;
            render(await data.list("tasks"));
            unsubscribe = data.subscribe("tasks", render);
          } catch {
            fail();
          } finally {
            root.setAttribute("aria-busy", "false");
          }
        }

        window.addEventListener("pagehide", () => unsubscribe(), { once: true });
        initialize();
      })();
    </script>
  </body>
</html>
