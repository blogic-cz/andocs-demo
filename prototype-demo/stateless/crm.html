<!doctype html><html><head><title>Client Dashboard</title>
<!-- andocs-opendesign-runtime:start -->
<meta name="andocs-opendesign-runtime" content="1" data-andocs-opendesign-runtime="v1">
<style data-andocs-opendesign-runtime="v1">
:root {
  --accent: oklch(0.95 0.02 255);
  --accent-foreground: oklch(0.48 0.2 255);
  --background: oklch(0.99 0 0);
  --border: oklch(0.9 0.01 250);
  --card: oklch(0.99 0 0);
  --card-foreground: oklch(0.15 0.03 250);
  --chart-1: oklch(0.55 0.18 255);
  --chart-2: oklch(0.5 0.16 255);
  --chart-3: oklch(0.45 0.14 255);
  --chart-4: oklch(0.4 0.12 255);
  --chart-5: oklch(0.35 0.1 255);
  --destructive: oklch(0.55 0.22 25);
  --destructive-foreground: oklch(1 0 0);
  --font-mono: "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --foreground: oklch(0.15 0.03 250);
  --input: oklch(0.96 0.005 250);
  --muted: oklch(0.96 0.005 250);
  --muted-foreground: oklch(0.4 0.02 250);
  --popover: oklch(0.99 0 0);
  --popover-foreground: oklch(0.15 0.03 250);
  --primary: oklch(0.48 0.2 255);
  --primary-foreground: oklch(1 0 0);
  --radius: 0.5rem;
  --ring: oklch(0.48 0.2 255);
  --secondary: oklch(0.97 0.01 250);
  --secondary-foreground: oklch(0.2 0.03 250);
  --shadow: 0 2px 4px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --shadow-color: rgb(0 0 0);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-offset-x: 0px;
  --shadow-offset-y: 2px;
  --shadow-opacity: 0.1;
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-spread: 0px;
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.06);
  --spacing: 0.25rem;
}
</style>
<link rel="stylesheet" data-andocs-shared-css data-andocs-opendesign-runtime="v1" href="../shared.css">
<script data-andocs-shared-js data-andocs-opendesign-runtime="v1" src="../shared.js"></script>
<script data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<!-- andocs-opendesign-runtime:end -->
</head><body>

<div
  x-data="{
    page: 'dashboard',
    selectedClient: null,
    clients: [
      { id: 1, name: 'Acme Corp', contact: 'John Smith', email: 'john@acme.com', status: 'active', revenue: 48500, deals: 3, lastContact: '2 days ago' },
      { id: 2, name: 'Globex Inc', contact: 'Jane Doe', email: 'jane@globex.com', status: 'active', revenue: 124000, deals: 7, lastContact: '1 week ago' },
      { id: 3, name: 'Initech', contact: 'Peter Gibbons', email: 'peter@initech.com', status: 'inactive', revenue: 12300, deals: 1, lastContact: '3 weeks ago' },
      { id: 4, name: 'Stark Industries', contact: 'Pepper Potts', email: 'pepper@stark.com', status: 'active', revenue: 340000, deals: 12, lastContact: 'Today' },
      { id: 5, name: 'Wayne Enterprises', contact: 'Lucius Fox', email: 'lucius@wayne.com', status: 'lead', revenue: 0, deals: 0, lastContact: '5 days ago' },
    ],
    get totalRevenue() { return this.clients.reduce((s, c) => s + c.revenue, 0) },
    get activeClients() { return this.clients.filter(c => c.status === 'active').length },
    get totalDeals() { return this.clients.reduce((s, c) => s + c.deals, 0) },
    formatCurrency(n) { return '$' + n.toLocaleString('en-US') },
    openClient(client) { this.selectedClient = client; this.page = 'detail'; },
    goBack() { this.page = 'dashboard'; this.selectedClient = null; },
    statusColor(s) {
      if (s === 'active') return 'background: #dcfce7; color: #166534';
      if (s === 'inactive') return 'background: #fee2e2; color: #991b1b';
      return 'background: #dbeafe; color: #1e40af';
    }
  }"
  class="prototype-shell"
>
  <!-- ═══ DASHBOARD PAGE ═══ -->
  <template x-if="page === 'dashboard'">
    <div>
      <!-- Header -->
      <div class="px-8 pt-8 pb-5">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="prototype-title">
              Client Dashboard
            </h1>
            <p class="prototype-subtitle mt-1">
              Manage your client portfolio
            </p>
          </div>
          <span class="prototype-badge"
            >Multi-page Demo</span
          >
        </div>
      </div>

      <hr class="prototype-divider" style="margin: 0" />

      <!-- Stats row -->
      <div class="grid grid-cols-3 gap-4 px-8 py-6">
        <div
          class="prototype-section"
          style="text-align: center; padding: 16px"
        >
          <span class="prototype-label">Total Revenue</span>
          <p
            style="
              font-size: 1.5rem;
              font-weight: 700;
              letter-spacing: -0.02em;
              font-variant-numeric: tabular-nums;
            "
            x-text="formatCurrency(totalRevenue)"
          ></p>
        </div>
        <div
          class="prototype-section"
          style="text-align: center; padding: 16px"
        >
          <span class="prototype-label"
            >Active Clients</span
          >
          <p
            style="font-size: 1.5rem; font-weight: 700"
            x-text="activeClients + ' / ' + clients.length"
          ></p>
        </div>
        <div
          class="prototype-section"
          style="text-align: center; padding: 16px"
        >
          <span class="prototype-label">Open Deals</span>
          <p
            style="
              font-size: 1.5rem;
              font-weight: 700;
              font-variant-numeric: tabular-nums;
            "
            x-text="totalDeals"
          ></p>
        </div>
      </div>

      <!-- Client list -->
      <div class="px-8 pb-8">
        <div
          style="
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
          "
        >
          <!-- Table header -->
          <div
            class="grid grid-cols-12 gap-2 px-4 py-2.5"
            style="
              background: var(--muted);
              border-bottom: 1px solid var(--border);
            "
          >
            <span
              class="prototype-label col-span-4"
              style="margin: 0"
              >Client</span
            >
            <span
              class="prototype-label col-span-3"
              style="margin: 0"
              >Contact</span
            >
            <span
              class="prototype-label col-span-2"
              style="margin: 0; text-align: right"
              >Revenue</span
            >
            <span
              class="prototype-label col-span-1"
              style="margin: 0; text-align: center"
              >Deals</span
            >
            <span
              class="prototype-label col-span-2"
              style="margin: 0; text-align: right"
              >Status</span
            >
          </div>

          <!-- Rows -->
          <template
            x-for="client in clients"
            :key="client.id"
          >
            <div
              @click="openClient(client)"
              class="grid cursor-pointer grid-cols-12 items-center gap-2 px-4 py-3 transition-colors"
              style="border-bottom: 1px solid var(--border)"
              :style="$el === $el.parentElement.lastElementChild ? 'border-bottom: none' : ''"
              onmouseenter="
                this.style.background = 'var(--accent)'
              "
              onmouseleave="
                this.style.background = 'transparent'
              "
            >
              <div class="col-span-4">
                <span
                  style="
                    font-weight: 600;
                    font-size: 0.875rem;
                  "
                  x-text="client.name"
                ></span>
              </div>
              <div class="col-span-3">
                <span
                  class="prototype-subtitle"
                  x-text="client.contact"
                ></span>
              </div>
              <div
                class="col-span-2"
                style="text-align: right"
              >
                <span
                  style="
                    font-size: 0.875rem;
                    font-weight: 600;
                    font-variant-numeric: tabular-nums;
                  "
                  x-text="formatCurrency(client.revenue)"
                ></span>
              </div>
              <div
                class="col-span-1"
                style="text-align: center"
              >
                <span
                  style="
                    font-size: 0.875rem;
                    font-variant-numeric: tabular-nums;
                  "
                  x-text="client.deals"
                ></span>
              </div>
              <div class="col-span-2 flex justify-end">
                <span
                  class="prototype-badge"
                  :style="statusColor(client.status)"
                  x-text="client.status"
                ></span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══ CLIENT DETAIL PAGE ═══ -->
  <template x-if="page === 'detail' && selectedClient">
    <div>
      <!-- Header with back -->
      <div class="px-8 pt-6 pb-5">
        <button
          @click="goBack()"
          class="prototype-btn prototype-btn-ghost mb-3"
          style="padding: 4px 8px; font-size: 0.75rem"
        >
          ← Back to Dashboard
        </button>
        <div class="flex items-center justify-between">
          <div>
            <h1
              class="prototype-title"
              x-text="selectedClient.name"
            ></h1>
            <p
              class="prototype-subtitle mt-1"
              x-text="selectedClient.email"
            ></p>
          </div>
          <span
            class="prototype-badge"
            :style="statusColor(selectedClient.status)"
            x-text="selectedClient.status"
          ></span>
        </div>
      </div>

      <hr class="prototype-divider" style="margin: 0" />

      <!-- Client info cards -->
      <div class="grid grid-cols-2 gap-4 px-8 py-6">
        <div
          class="prototype-section"
          style="padding: 20px"
        >
          <span class="prototype-label"
            >Primary Contact</span
          >
          <p
            style="
              font-size: 0.9375rem;
              font-weight: 600;
              margin-top: 2px;
            "
            x-text="selectedClient.contact"
          ></p>
          <p
            class="prototype-subtitle"
            x-text="selectedClient.email"
          ></p>
        </div>
        <div
          class="prototype-section"
          style="padding: 20px"
        >
          <span class="prototype-label">Last Contact</span>
          <p
            style="
              font-size: 0.9375rem;
              font-weight: 600;
              margin-top: 2px;
            "
            x-text="selectedClient.lastContact"
          ></p>
          <p class="prototype-subtitle">
            Most recent interaction
          </p>
        </div>
      </div>

      <!-- Revenue & deals -->
      <div class="grid grid-cols-2 gap-4 px-8 pb-6">
        <div
          class="prototype-section"
          style="text-align: center; padding: 24px"
        >
          <span class="prototype-label">Total Revenue</span>
          <p
            class="prototype-value"
            style="font-size: 2rem; margin-top: 4px"
            x-text="formatCurrency(selectedClient.revenue)"
          ></p>
        </div>
        <div
          class="prototype-section"
          style="text-align: center; padding: 24px"
        >
          <span class="prototype-label">Active Deals</span>
          <p
            class="prototype-value"
            style="font-size: 2rem; margin-top: 4px"
            x-text="selectedClient.deals"
          ></p>
        </div>
      </div>

      <hr
        class="prototype-divider"
        style="margin: 0 32px"
      />

      <!-- Actions -->
      <div class="flex gap-3 px-8 py-6">
        <button
          class="prototype-btn prototype-btn-primary flex-1"
        >
          Send Email
        </button>
        <button
          class="prototype-btn prototype-btn-secondary flex-1"
        >
          Schedule Call
        </button>
        <button class="prototype-btn prototype-btn-ghost">
          Edit
        </button>
      </div>
    </div>
  </template>
</div>
</body></html>
