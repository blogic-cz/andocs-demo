<!doctype html>
<html lang="en"><head>
<!-- andocs-opendesign-runtime:start -->
<meta name="andocs-opendesign-runtime" content="1" data-andocs-opendesign-runtime="v1">
<style data-andocs-opendesign-runtime="v1">
:root {
  --accent: oklch(0.95 0.02 255);
  --accent-foreground: oklch(0.48 0.2 255);
  --background: oklch(0.99 0 0);
  --border: oklch(0.9 0.01 250);
  --card: oklch(0.99 0 0);
  --card-foreground: oklch(0.15 0.03 250);
  --chart-1: oklch(0.55 0.18 255);
  --chart-2: oklch(0.5 0.16 255);
  --chart-3: oklch(0.45 0.14 255);
  --chart-4: oklch(0.4 0.12 255);
  --chart-5: oklch(0.35 0.1 255);
  --destructive: oklch(0.55 0.22 25);
  --destructive-foreground: oklch(1 0 0);
  --font-mono: "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --foreground: oklch(0.15 0.03 250);
  --input: oklch(0.96 0.005 250);
  --muted: oklch(0.96 0.005 250);
  --muted-foreground: oklch(0.4 0.02 250);
  --popover: oklch(0.99 0 0);
  --popover-foreground: oklch(0.15 0.03 250);
  --primary: oklch(0.48 0.2 255);
  --primary-foreground: oklch(1 0 0);
  --radius: 0.5rem;
  --ring: oklch(0.48 0.2 255);
  --secondary: oklch(0.97 0.01 250);
  --secondary-foreground: oklch(0.2 0.03 250);
  --shadow: 0 2px 4px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --shadow-color: rgb(0 0 0);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-offset-x: 0px;
  --shadow-offset-y: 2px;
  --shadow-opacity: 0.1;
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-spread: 0px;
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.06);
  --spacing: 0.25rem;
}
</style>
<link rel="stylesheet" data-andocs-shared-css data-andocs-opendesign-runtime="v1" href="../shared.css">
<script data-andocs-shared-js data-andocs-opendesign-runtime="v1" src="../shared.js"></script>
<script data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<!-- andocs-opendesign-runtime:end -->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Todo</title>
    <style>
      .todo { max-width: 760px; margin: 0 auto; }
      .todo-header, .task-row, .task-actions { display: flex; align-items: center; gap: 12px; }
      .todo-header { justify-content: space-between; padding: 24px; }
      .todo-content { padding: 0 24px 24px; }
      .task-form { display: flex; gap: 10px; margin: 18px 0; }
      .task-form input { min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); color: var(--foreground); font: inherit; }
      .task-form input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
      .task-list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
      .task-row { min-height: 56px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); }
      .task-row label { flex: 1; overflow-wrap: anywhere; }
      .task-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
      .task-row [data-complete="true"] { color: var(--muted-foreground); text-decoration: line-through; }
      .task-actions { margin-left: auto; }
      .task-actions button { padding: 5px 8px; }
      .task-status { min-height: 1.5em; color: var(--muted-foreground); font-size: 0.8125rem; }
      .task-status[data-kind="error"] { color: #a33b20; }
      .task-list [hidden] { display: none; }
      .todo [disabled] { opacity: 0.6; }
      @media (max-width: 560px) { body { padding: 12px; } .todo-header { padding: 18px; } .todo-content { padding: 0 18px 18px; } .task-form { flex-direction: column; } }
    </style>
  </head>
  <body>
    <main class="prototype-shell todo" aria-busy="true">
      <header class="todo-header">
        <div>
          <h1 class="prototype-title">Team Todo · OpenDesign</h1>
          <p class="prototype-subtitle mt-1">A shared task list for your project</p>
        </div>
        <span class="prototype-badge">Shared tasks</span>
      </header>
      <hr class="prototype-divider" style="margin: 0">
      <section class="todo-content" aria-label="Tasks">
        <p id="task-status" class="task-status" role="status" aria-live="polite">Opening tasks…</p>
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-title">Task title</label>
          <input id="task-title" name="title" maxlength="160" autocomplete="off" placeholder="Add a task" required="">
          <button id="submit-task" type="button" class="prototype-btn prototype-btn-primary">Add task</button>
          <button id="cancel-edit" type="button" class="prototype-btn prototype-btn-ghost" hidden="">Cancel</button>
        </form>
        <ul id="task-list" class="task-list" aria-label="Saved tasks"></ul>
      </section>
    </main>
    <script>
      (() => {
        const data = window.andocsData;
        const root = document.querySelector(".todo");
        const form = document.querySelector("#task-form");
        const titleInput = document.querySelector("#task-title");
        const list = document.querySelector("#task-list");
        const status = document.querySelector("#task-status");
        const submitButton = document.querySelector("#submit-task");
        const cancelButton = document.querySelector("#cancel-edit");
        let tasks = [];
        let editingId = null;
        let busy = true;
        let stopped = false;
        let unsubscribe = () => {};

        function setStatus(message, kind = "") {
          status.textContent = message;
          status.dataset.kind = kind;
        }

        function validTask(task) {
          return task && typeof task === "object" && !Array.isArray(task)
            && typeof task.title === "string" && task.title.trim() !== ""
            && typeof task.completed === "boolean"
            && typeof task.createdAt === "number" && Number.isFinite(task.createdAt)
            && typeof task.updatedAt === "number" && Number.isFinite(task.updatedAt);
        }

        function stopWithError(message) {
          stopped = true;
          busy = true;
          setStatus(message, "error");
          render();
        }

        function receiveRecords(records) {
          if (!Array.isArray(records) || !records.every((record) =>
            record && typeof record.id === "string" && validTask(record.value))) {
            stopWithError("Task data is invalid. Editing is disabled to protect saved records.");
            return;
          }
          tasks = records.map(({ id, value }) => ({ ...value, id }))
            .sort((left, right) => left.createdAt - right.createdAt || left.id.localeCompare(right.id));
          if (editingId && !tasks.some((task) => task.id === editingId)) clearForm();
          render();
        }

        function render() {
          list.replaceChildren();
          if (!tasks.length) {
            const empty = document.createElement("li");
            empty.className = "prototype-subtitle";
            empty.textContent = "No tasks yet. Add one above.";
            list.append(empty);
          }
          for (const task of tasks) {
            const row = document.createElement("li");
            row.className = "task-row";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.id = `task-${task.id}`;
            checkbox.checked = task.completed;
            checkbox.disabled = busy || stopped;
            checkbox.setAttribute("aria-label", `${task.completed ? "Uncomplete" : "Complete"} ${task.title}`);
            checkbox.addEventListener("change", () => changeTask(task, { completed: checkbox.checked }));
            const label = document.createElement("label");
            label.htmlFor = checkbox.id;
            label.dataset.complete = String(task.completed);
            label.textContent = task.title;
            const actions = document.createElement("div");
            actions.className = "task-actions";
            for (const [text, action] of [["Edit", () => beginEdit(task)], ["Delete", () => removeTask(task)]]) {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "prototype-btn prototype-btn-ghost";
              button.textContent = text;
              button.setAttribute("aria-label", `${text} ${task.title}`);
              button.disabled = busy || stopped;
              button.addEventListener("click", action);
              actions.append(button);
            }
            row.append(checkbox, label, actions);
            list.append(row);
          }
          for (const control of form.elements) control.disabled = busy || stopped;
          cancelButton.hidden = editingId === null;
        }

        function clearForm() {
          form.reset();
          editingId = null;
          submitButton.textContent = "Add task";
          cancelButton.hidden = true;
        }

        function beginEdit(task) {
          editingId = task.id;
          titleInput.value = task.title;
          submitButton.textContent = "Save task";
          cancelButton.hidden = false;
          titleInput.focus();
        }

        async function write(operation, successMessage) {
          if (busy || stopped) return;
          busy = true;
          render();
          setStatus("Saving task…");
          try {
            const result = await operation();
            if (result?.local !== "stored") throw new Error("Local storage was not confirmed.");
            setStatus(successMessage);
          } catch {
            setStatus("The change could not be confirmed. Check the list before trying again.", "error");
          } finally {
            busy = false;
            render();
          }
        }

        function changeTask(task, changes) {
          const next = { ...task, ...changes, updatedAt: Date.now() };
          return write(() => data.update("tasks", task.id, next), "Task saved on this device.");
        }

        function removeTask(task) {
          return write(() => data.delete("tasks", task.id), "Task deleted.");
        }

        function saveTask() {
          if (!form.reportValidity()) return;
          const title = titleInput.value.trim();
          if (!title) {
            setStatus("Enter a task title.", "error");
            return;
          }
          const id = editingId;
          const now = Date.now();
          const task = id
            ? { ...tasks.find((item) => item.id === id), title, updatedAt: now }
            : { title, completed: false, createdAt: now, updatedAt: now };
          if (!validTask(task)) {
            setStatus("The task could not be validated.", "error");
            return;
          }
          void write(
            () => id ? data.update("tasks", id, task) : data.create("tasks", task),
            id ? "Task updated on this device." : "Task added on this device.",
          ).then(() => {
            if (status.dataset.kind !== "error") clearForm();
            render();
          });
        }

        function onRecordsError() {
          stopWithError("Live task updates failed. Reload before editing more records.");
        }
        receiveRecords.error = onRecordsError;

        submitButton.addEventListener("click", saveTask);
        form.addEventListener("submit", (event) => { event.preventDefault(); saveTask(); });
        cancelButton.addEventListener("click", () => { clearForm(); render(); });
        window.addEventListener("pagehide", () => unsubscribe(), { once: true });

        async function initialize() {
          try {
            if (!data) throw new Error("The scoped task API is unavailable.");
            await data.ready;
            receiveRecords(await data.list("tasks"));
            if (stopped) return;
            unsubscribe = data.subscribe("tasks", receiveRecords);
            busy = false;
            setStatus("Tasks are ready. Changes save to the selected dataset.");
            render();
          } catch {
            stopWithError("Tasks could not be opened. Existing data was left unchanged; reload to retry.");
          } finally {
            root.setAttribute("aria-busy", "false");
          }
        }

        initialize();
      })();
    </script>


</body></html>
