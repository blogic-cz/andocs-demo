<!doctype html><html><head><title>Stateful Client Database</title>
<!-- andocs-opendesign-runtime:start -->
<meta name="andocs-opendesign-runtime" content="1" data-andocs-opendesign-runtime="v1">
<style data-andocs-opendesign-runtime="v1">
:root {
  --accent: oklch(0.95 0.02 255);
  --accent-foreground: oklch(0.48 0.2 255);
  --background: oklch(0.99 0 0);
  --border: oklch(0.9 0.01 250);
  --card: oklch(0.99 0 0);
  --card-foreground: oklch(0.15 0.03 250);
  --chart-1: oklch(0.55 0.18 255);
  --chart-2: oklch(0.5 0.16 255);
  --chart-3: oklch(0.45 0.14 255);
  --chart-4: oklch(0.4 0.12 255);
  --chart-5: oklch(0.35 0.1 255);
  --destructive: oklch(0.55 0.22 25);
  --destructive-foreground: oklch(1 0 0);
  --font-mono: "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --foreground: oklch(0.15 0.03 250);
  --input: oklch(0.96 0.005 250);
  --muted: oklch(0.96 0.005 250);
  --muted-foreground: oklch(0.4 0.02 250);
  --popover: oklch(0.99 0 0);
  --popover-foreground: oklch(0.15 0.03 250);
  --primary: oklch(0.48 0.2 255);
  --primary-foreground: oklch(1 0 0);
  --radius: 0.5rem;
  --ring: oklch(0.48 0.2 255);
  --secondary: oklch(0.97 0.01 250);
  --secondary-foreground: oklch(0.2 0.03 250);
  --shadow: 0 2px 4px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --shadow-color: rgb(0 0 0);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-offset-x: 0px;
  --shadow-offset-y: 2px;
  --shadow-opacity: 0.1;
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  --shadow-spread: 0px;
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.06);
  --spacing: 0.25rem;
}
</style>
<link rel="stylesheet" data-andocs-shared-css data-andocs-opendesign-runtime="v1" href="../shared.css">
<script data-andocs-shared-js data-andocs-opendesign-runtime="v1" src="../shared.js"></script>
<script data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer data-andocs-opendesign-runtime="v1" src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<!-- andocs-opendesign-runtime:end -->
</head><body>

<style>
  .database { max-width: 1120px; margin: 0 auto; }
  .database-header, .database-toolbar, .client-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .database-header { padding: 28px 32px 20px; }
  .database-toolbar { padding: 16px 32px; }
  .database-body { display: grid; grid-template-columns: minmax(230px, 0.8fr) minmax(0, 2fr); gap: 20px; padding: 0 32px 32px; }
  .client-form { display: grid; gap: 14px; align-content: start; }
  .client-form label { display: grid; gap: 5px; font-size: 0.8125rem; font-weight: 600; }
  .client-form input, .client-form select, .client-form textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); color: var(--foreground); font: inherit; }
  .client-form input:focus-visible, .client-form select:focus-visible, .client-form textarea:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  .client-form textarea { min-height: 82px; resize: vertical; }
  .client-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  .client-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8125rem; }
  .client-table th, .client-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .client-table th { background: var(--muted); color: var(--muted-foreground); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .client-table tr:last-child td { border-bottom: 0; }
  .client-table .name { font-weight: 650; }
  .client-table .notes { display: block; max-width: 220px; margin-top: 3px; color: var(--muted-foreground); font-size: 0.75rem; }
  .client-actions { justify-content: flex-start; }
  .client-actions button { padding: 4px 7px; font-size: 0.75rem; }
  .save-state { min-height: 1.5em; padding: 0 32px 12px; color: var(--muted-foreground); font-size: 0.8125rem; }
  .save-state[data-kind="warning"], .save-state[data-kind="error"] { color: #a33b20; }
  .save-state[data-kind="success"] { color: #187347; }
  .database [hidden] { display: none; }
  .database fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
  .database fieldset:disabled { opacity: 0.65; }
  @media (max-width: 720px) {
    body { padding: 12px; }
    .database-header, .database-toolbar { padding-right: 18px; padding-left: 18px; }
    .database-body { grid-template-columns: 1fr; padding: 0 18px 20px; }
    .save-state { padding-right: 18px; padding-left: 18px; }
  }
</style>

<main class="prototype-shell database" aria-busy="true">
  <header class="database-header">
    <div>
      <h1 class="prototype-title">Client database</h1>
      <p class="prototype-subtitle mt-1">Client records with automatic local saving</p>
    </div>
    <span class="prototype-badge">Stateful prototype</span>
  </header>
  <hr class="prototype-divider" style="margin: 0" />

  <p id="save-state" class="save-state" role="status" aria-live="polite">Loading saved client data…</p>

  <fieldset id="controls" disabled>
    <div class="database-toolbar">
      <span class="prototype-subtitle">Changes save automatically in this browser.</span>
      <span id="sync-state" class="prototype-subtitle" role="status" aria-live="polite"></span>
    </div>

    <div class="database-body">
      <form id="client-form" class="prototype-section client-form">
        <h2 id="form-title" class="prototype-title" style="font-size: 1rem">Add a client</h2>
        <label>Name <input name="name" autocomplete="name" maxlength="80" required /></label>
        <label>Company <input name="company" maxlength="100" required /></label>
        <label>Email <input name="email" type="email" autocomplete="email" maxlength="254" required /></label>
        <label>Status
          <select name="status">
            <option value="prospect">Prospect</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </label>
        <label>Notes <textarea name="notes" maxlength="300"></textarea></label>
        <div class="client-actions">
          <button id="submit-button" type="button" class="prototype-btn prototype-btn-primary">Add client</button>
          <button id="cancel-button" type="button" class="prototype-btn prototype-btn-ghost" hidden>Cancel edit</button>
        </div>
      </form>

      <section aria-label="Saved client records">
        <div class="client-table-wrap">
          <table class="client-table">
            <thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
            <tbody id="client-rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </fieldset>
</main>

<script>
  (() => {
    const data = window.andocsData;
    const root = document.querySelector(".database");
    const controls = document.querySelector("#controls");
    const form = document.querySelector("#client-form");
    const rows = document.querySelector("#client-rows");
    const cancelButton = document.querySelector("#cancel-button");
    const statusMessage = document.querySelector("#save-state");
    let clients = [];
    let editingId = null;
    let saving = false;
    let failed = false;
    let unsubscribe = () => {};
    let unsubscribeStatus = () => {};

    function setMessage(message, kind = "") {
      statusMessage.textContent = message;
      statusMessage.dataset.kind = kind;
    }

    function isClient(client) {
      return client && typeof client === "object" && !Array.isArray(client)
        && ["name", "company", "email", "status", "notes"].every((key) => typeof client[key] === "string")
        && client.name.trim() !== "" && client.company.trim() !== ""
        && ["prospect", "active", "inactive"].includes(client.status);
    }

    function migrateClients(stored) {
      if (!stored || stored.version !== 1 || !Array.isArray(stored.clients)) {
        throw new Error("Saved data is not a recognized client list.");
      }
      const ids = new Set();
      return stored.clients.flatMap((client) => {
        if (!isClient(client) || typeof client.id !== "string" || !client.id || ids.has(client.id)) {
          throw new Error("Saved client data is invalid.");
        }
        ids.add(client.id);
        // These IDs were retired by the original demo; never import its sample rows.
        if (["sample-1", "sample-2", "sample-3"].includes(client.id)) return [];
        const { name, company, email, status, notes } = client;
        return [{ collection: "clients", legacyId: client.id, value: { name, company, email, status, notes } }];
      });
    }

    function stopEditing(message) {
      failed = true;
      controls.disabled = true;
      setMessage(message, "error");
    }

    function receiveRecords(records) {
      if (!Array.isArray(records) || !records.every((record) => record && typeof record.id === "string" && isClient(record.value))) {
        stopEditing("Stored records could not be displayed. Editing is disabled; reload the page to retry.");
        return;
      }
      clients = records.map((record) => ({ ...record.value, id: record.id }));
      if (editingId && !clients.some((client) => client.id === editingId)) clearForm();
      render();
    }

    function addCell(row, value, className = "") {
      const cell = document.createElement("td");
      cell.textContent = value;
      if (className) cell.className = className;
      row.append(cell);
      return cell;
    }

    function render() {
      rows.replaceChildren();
      if (!clients.length) {
        const row = document.createElement("tr");
        const cell = addCell(row, "No clients yet. Add one with the form.");
        cell.colSpan = 5;
        rows.append(row);
      }
      for (const client of clients) {
        const row = document.createElement("tr");
        const nameCell = addCell(row, client.name, "name");
        if (client.notes) {
          const note = document.createElement("span");
          note.className = "notes";
          note.textContent = client.notes;
          nameCell.append(note);
        }
        addCell(row, client.company);
        addCell(row, client.email);
        addCell(row, client.status[0].toUpperCase() + client.status.slice(1));
        const actions = document.createElement("td");
        const actionGroup = document.createElement("div");
        actionGroup.className = "client-actions";
        for (const [label, action] of [["Edit", () => beginEdit(client)], ["Delete", () => removeClient(client)]]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "prototype-btn prototype-btn-ghost";
          button.textContent = label;
          button.setAttribute("aria-label", `${label} ${client.name}`);
          button.addEventListener("click", action);
          actionGroup.append(button);
        }
        actions.append(actionGroup);
        row.append(actions);
        rows.append(row);
      }
    }

    function clearForm() {
      form.reset();
      editingId = null;
      document.querySelector("#form-title").textContent = "Add a client";
      document.querySelector("#submit-button").textContent = "Add client";
      cancelButton.hidden = true;
    }

    function beginEdit(client) {
      editingId = client.id;
      for (const key of ["name", "company", "email", "status", "notes"]) form.elements[key].value = client[key];
      document.querySelector("#form-title").textContent = "Edit client";
      document.querySelector("#submit-button").textContent = "Update client";
      cancelButton.hidden = false;
      form.elements.name.focus();
    }

    async function saveChange(operation, onSaved) {
      if (saving || failed || controls.disabled) return;
      saving = true;
      controls.disabled = true;
      setMessage("Saving client data…");
      try {
        await operation();
        receiveRecords(await data.list("clients"));
        if (!failed) onSaved();
        if (!failed) setMessage("Saved in this browser. Relay status does not confirm this individual save.", "success");
      } catch {
        stopEditing("The save could not be confirmed. Reload the page to check stored records before trying again. Your form is still here.");
      } finally {
        saving = false;
        controls.disabled = failed;
      }
    }

    function removeClient(client) {
      return saveChange(() => data.delete("clients", client.id), () => {
        if (editingId === client.id) clearForm();
      });
    }

    function addOrUpdateClient() {
      if (!form.checkValidity()) {
        form.reportValidity();
        setMessage("Enter a name, company, and valid email.", "error");
        return;
      }
      const values = Object.fromEntries(new FormData(form));
      const client = {
        name: values.name.trim(),
        company: values.company.trim(),
        email: values.email.trim(),
        status: values.status,
        notes: values.notes.trim(),
      };
      if (!isClient(client)) {
        setMessage("Enter a name and company with more than spaces.", "error");
        return;
      }
      const id = editingId;
      return saveChange(
        () => id ? data.update("clients", id, client) : data.create("clients", client),
        clearForm,
      );
    }

    document.querySelector("#submit-button").addEventListener("click", addOrUpdateClient);
    form.addEventListener("submit", (event) => { event.preventDefault(); void addOrUpdateClient(); });
    cancelButton.addEventListener("click", clearForm);
    window.addEventListener("pagehide", () => { unsubscribe(); unsubscribeStatus(); });

    async function initialize() {
      try {
        if (!data) throw new Error("Prototype data is unavailable.");
        data.registerMigration(1, migrateClients);
        await data.ready;
        receiveRecords(await data.list("clients"));
        if (failed) return;
        receiveRecords.error = () => stopEditing("Live updates failed. Reload the page before editing more records.");
        unsubscribe = data.subscribe("clients", receiveRecords);
        const showSyncStatus = (status) => {
          document.querySelector("#sync-state").textContent = `Relay: ${status}`;
        };
        showSyncStatus.error = () => showSyncStatus("unavailable");
        unsubscribeStatus = data.subscribeSyncStatus(showSyncStatus);
        if (failed) return;
        controls.disabled = false;
        setMessage(clients.length ? "Your saved client records have been restored." : "No clients yet. Add one to save it automatically.", "success");
      } catch {
        stopEditing("Client data could not be opened or migrated. Existing saved data was not replaced. Reload the page to retry.");
      } finally {
        render();
        root.setAttribute("aria-busy", "false");
      }
    }

    initialize();
  })();
</script>
</body></html>
